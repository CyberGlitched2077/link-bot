<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ዲቫይስ ማገናኛ</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f2f5; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; width: 320px; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background-color: #0088cc; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #006699; }
    </style>
</head>
<body>

<div class="card">
    <h2>ዲቫይስዎን ለመመዝገብ ስልክዎን ያስገቡ</h2>
    <input type="tel" id="phoneNumber" placeholder="ምሳሌ፦ +251912345678" required>
    <button onclick="registerDevice()">ዲቫይስ አድ አድርግ</button>
</div>

<script>
function getDeviceType() {
    const ua = navigator.userAgent;
    if (/android/i.test(ua)) return "Android_Phone";
    if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) return "iPhone";
    if (/Windows/i.test(ua)) return "Windows_PC";
    if (/Mac/i.test(ua)) return "Mac_PC";
    return "Unknown_Device";
}

function registerDevice() {
    var phone = document.getElementById("phoneNumber").value.trim();
    var device = getDeviceType();
    
    // የእርስዎ ቦት ዩዘርኔም እዚህ ጋር በታማኝነት ተተክቷል
    var botUsername = "foyytrebot"; 

    if (phone === "") {
        alert("እባክዎ መጀመሪያ ስልክ ቁጥር ያስገቡ!");
        return;
    }

    var payload = phone + "_" + device;
    var telegramUrl = "https://t.me" + botUsername + "?start=" + encodeURIComponent(payload);
    window.location.href = telegramUrl;
}
</script>

</body>
</html>
